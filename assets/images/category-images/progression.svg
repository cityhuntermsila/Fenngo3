<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="360" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#92400E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Card -->
  <rect x="12" y="10" width="336" height="226" rx="34" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="7" filter="url(#cardShadow)"/>
  <rect x="24" y="22" width="312" height="202" rx="26" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3"/>

  <!-- Laptop Screen Frame -->
  <rect x="46" y="36" width="190" height="128" rx="14" fill="#3B82F6" stroke="#1D4ED8" stroke-width="4"/>
  <rect x="54" y="44" width="174" height="112" rx="9" fill="url(#screenGrad)"/>

  <!-- Unit Progress Bars on Left of Screen -->
  <rect x="62" y="54" width="66" height="12" rx="6" fill="#3B82F6"/>
  <rect x="62" y="72" width="52" height="12" rx="6" fill="#EF4444"/>
  <rect x="62" y="90" width="72" height="12" rx="6" fill="#22C55E"/>
  <rect x="62" y="108" width="38" height="12" rx="6" fill="#F59E0B"/>
  <rect x="62" y="126" width="26" height="12" rx="6" fill="#A855F7"/>

  <!-- Pencil Skill Bars on Right of Screen -->
  <!-- Blue Pencil -->
  <rect x="146" y="78" width="14" height="62" rx="3" fill="#2563EB"/>
  <polygon points="146,78 153,64 160,78" fill="#FDE68A"/>
  <polygon points="150,70 153,64 156,70" fill="#2563EB"/>

  <!-- Red Pencil -->
  <rect x="166" y="86" width="14" height="54" rx="3" fill="#EF4444"/>
  <polygon points="166,86 173,72 180,86" fill="#FDE68A"/>
  <polygon points="170,78 173,72 176,78" fill="#EF4444"/>

  <!-- Green Pencil -->
  <rect x="186" y="84" width="14" height="56" rx="3" fill="#22C55E"/>
  <polygon points="186,84 193,70 200,84" fill="#FDE68A"/>
  <polygon points="190,76 193,70 196,76" fill="#22C55E"/>

  <!-- Yellow Pencil -->
  <rect x="206" y="94" width="14" height="46" rx="3" fill="#F59E0B"/>
  <polygon points="206,94 213,80 220,94" fill="#FDE68A"/>
  <polygon points="210,86 213,80 216,86" fill="#F59E0B"/>

  <!-- Laptop Base -->
  <path d="M34 166 H248 L236 178 H46 Z" fill="#93C5FD" stroke="#1D4ED8" stroke-width="3"/>

  <!-- Remediation / Star Badge Card on Right -->
  <rect x="248" y="42" width="74" height="118" rx="16" fill="#FDE047" stroke="#D97706" stroke-width="3"/>
  <!-- Cute Fox Ears & Face Icon -->
  <polygon points="262,56 252,32 276,46" fill="#F97316" stroke="#9A3412" stroke-width="2"/>
  <polygon points="308,56 318,32 294,46" fill="#F97316" stroke="#9A3412" stroke-width="2"/>
  <circle cx="285" cy="60" r="16" fill="#FB923C" stroke="#9A3412" stroke-width="2"/>
  <circle cx="279" cy="58" r="3.5" fill="#1E293B"/>
  <circle cx="291" cy="58" r="3.5" fill="#1E293B"/>
  <ellipse cx="285" cy="65" rx="3" ry="2" fill="#1E293B"/>

  <!-- Gold Star inside card -->
  <polygon points="285,84 291,96 304,98 294,107 297,120 285,113 273,120 276,107 266,98 279,96" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
  <text x="285" y="144" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="13" fill="#78350F">3PS ⭐</text>
</svg>
