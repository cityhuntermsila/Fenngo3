<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" width="420" height="310">
  <defs>
    <linearGradient id="bpBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="bpRay" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bpPill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="bpCardSh" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.42"/>
    </filter>
    <filter id="bpSoftSh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="14" y="10" width="392" height="262" rx="48" fill="#ffffff" filter="url(#bpCardSh)"/>
  <rect x="22" y="18" width="376" height="246" rx="42" fill="url(#bpBg)"/>
  <rect x="22" y="18" width="376" height="246" rx="42" fill="url(#bpRay)"/>

  <!-- Decorative Callout Badges (Eye, Hand, Ear, Foot) -->
  <g filter="url(#bpSoftSh)">
    <!-- Eye badge left -->
    <circle cx="82" cy="84" r="28" fill="#ffffff" stroke="#38bdf8" stroke-width="4"/>
    <ellipse cx="82" cy="84" rx="18" ry="11" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="82" cy="84" r="7" fill="#0284c7"/>
    <circle cx="84" cy="82" r="2.5" fill="#ffffff"/>

    <!-- Hand badge right -->
    <circle cx="338" cy="84" r="28" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
    <path d="M330 98 L330 82 Q330 78 333 78 Q336 78 336 82 L336 74 Q336 70 339 70 Q342 70 342 74 L342 76 Q342 72 345 72 Q348 72 348 76 L348 92 Q348 100 339 100 Q330 100 330 98 Z" fill="#fcd3b6" stroke="#b45309" stroke-width="2"/>

    <!-- Happy Kid Full Body Center -->
    <g transform="translate(154, 34)">
      <!-- Arms raised -->
      <path d="M22 92 Q-4 72 6 54" fill="none" stroke="#fcd3b6" stroke-width="14" stroke-linecap="round"/>
      <path d="M90 92 Q116 72 106 54" fill="none" stroke="#fcd3b6" stroke-width="14" stroke-linecap="round"/>
      <circle cx="6" cy="52" r="9" fill="#fcd3b6" stroke="#ffffff" stroke-width="2"/>
      <circle cx="106" cy="52" r="9" fill="#fcd3b6" stroke="#ffffff" stroke-width="2"/>

      <!-- Legs -->
      <rect x="34" y="136" width="16" height="36" rx="8" fill="#fcd3b6"/>
      <rect x="62" y="136" width="16" height="36" rx="8" fill="#fcd3b6"/>
      <!-- Shoes -->
      <ellipse cx="40" cy="172" rx="13" ry="7" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
      <ellipse cx="72" cy="172" rx="13" ry="7" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>

      <!-- Shirt & Shorts -->
      <rect x="28" y="80" width="56" height="46" rx="16" fill="#3b82f6" stroke="#ffffff" stroke-width="3.5"/>
      <rect x="30" y="118" width="52" height="24" rx="10" fill="#facc15" stroke="#ffffff" stroke-width="3"/>

      <!-- Head & Ears -->
      <circle cx="20" cy="46" r="8" fill="#fcd3b6" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="92" cy="46" r="8" fill="#fcd3b6" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="56" cy="44" r="34" fill="#fcd3b6" stroke="#ffffff" stroke-width="4"/>
      <!-- Hair -->
      <path d="M24 38 Q30 8 56 10 Q82 8 88 38 Q72 24 56 26 Q40 24 24 38 Z" fill="#78350f"/>
      <!-- Eyes, Nose, Mouth -->
      <circle cx="44" cy="44" r="4.5" fill="#1e293b"/>
      <circle cx="68" cy="44" r="4.5" fill="#1e293b"/>
      <circle cx="56" cy="51" r="3" fill="#f97316"/>
      <path d="M44 58 Q56 68 68 58" fill="none" stroke="#be123c" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Label Banner -->
  <rect x="54" y="218" width="312" height="68" rx="24" fill="#ffffff" filter="url(#bpSoftSh)"/>
  <rect x="59" y="223" width="302" height="58" rx="20" fill="url(#bpPill)"/>
  <text x="210" y="261" text-anchor="middle" fill="#ffffff" font-family="'Comic Sans MS', 'Poppins', sans-serif" font-size="31" font-weight="900">Body Parts</text>
</svg>
