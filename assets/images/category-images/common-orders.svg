<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" width="420" height="310">
  <defs>
    <linearGradient id="coBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <radialGradient id="coRay" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffe4e6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coPill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="coCardSh" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#881337" flood-opacity="0.42"/>
    </filter>
    <filter id="coSoftSh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#4c0519" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="14" y="10" width="392" height="262" rx="48" fill="#ffffff" filter="url(#coCardSh)"/>
  <rect x="22" y="18" width="376" height="246" rx="42" fill="url(#coBg)"/>
  <rect x="22" y="18" width="376" height="246" rx="42" fill="url(#coRay)"/>

  <g filter="url(#coSoftSh)">
    <!-- Classroom Chalkboard (Back) -->
    <rect x="78" y="42" width="264" height="132" rx="18" fill="#14532d" stroke="#fde68a" stroke-width="8"/>
    <!-- Check, Cross, Circle & ABC on Board -->
    <path d="M104 82 L116 94 L138 68" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M286 68 L312 94 M312 68 L286 94" fill="none" stroke="#f87171" stroke-width="6" stroke-linecap="round"/>
    <circle cx="300" cy="132" r="16" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <text x="122" y="142" fill="#ffffff" font-family="'Comic Sans MS', sans-serif" font-size="24" font-weight="900">A B C</text>

    <!-- Kid Raising Hand (Front Center) -->
    <g transform="translate(164, 72)">
      <!-- Raised Right Arm -->
      <path d="M70 76 L88 18" fill="none" stroke="#fcd3b6" stroke-width="14" stroke-linecap="round"/>
      <circle cx="88" cy="14" r="10" fill="#fcd3b6" stroke="#ffffff" stroke-width="2.5"/>
      <!-- Body -->
      <path d="M16 116 Q46 76 76 116 Z" fill="#facc15" stroke="#ffffff" stroke-width="4"/>
      <!-- Head -->
      <circle cx="46" cy="56" r="30" fill="#fcd3b6" stroke="#ffffff" stroke-width="4"/>
      <path d="M18 48 Q26 20 46 22 Q66 20 74 48 Q60 36 46 38 Q32 36 18 48 Z" fill="#451a03"/>
      <circle cx="36" cy="56" r="4" fill="#1e293b"/>
      <circle cx="56" cy="56" r="4" fill="#1e293b"/>
      <path d="M36 68 Q46 76 56 68" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Label Banner -->
  <rect x="44" y="218" width="332" height="68" rx="24" fill="#ffffff" filter="url(#coSoftSh)"/>
  <rect x="49" y="223" width="322" height="58" rx="20" fill="url(#coPill)"/>
  <text x="210" y="261" text-anchor="middle" fill="#ffffff" font-family="'Comic Sans MS', 'Poppins', sans-serif" font-size="29" font-weight="900">Common Orders</text>
</svg>
