<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="spellGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blockA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="blockB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="blockC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="spellShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#spellGlow)"/>
  <!-- Block A (Bottom Left) -->
  <g filter="url(#spellShadow)">
    <rect x="30" y="95" width="56" height="56" rx="14" fill="url(#blockA)"/>
    <rect x="34" y="99" width="48" height="48" rx="10" fill="none" stroke="#fca5a5" stroke-width="2"/>
    <text x="58" y="136" font-size="34" text-anchor="middle" fill="#ffffff" font-weight="900" font-family="Nunito, sans-serif">A</text>
  </g>
  <!-- Block C (Bottom Right) -->
  <g filter="url(#spellShadow)">
    <rect x="114" y="95" width="56" height="56" rx="14" fill="url(#blockC)"/>
    <rect x="118" y="99" width="48" height="48" rx="10" fill="none" stroke="#fde68a" stroke-width="2"/>
    <text x="142" y="136" font-size="34" text-anchor="middle" fill="#ffffff" font-weight="900" font-family="Nunito, sans-serif">C</text>
  </g>
  <!-- Block B (Top Center) -->
  <g filter="url(#spellShadow)">
    <rect x="72" y="42" width="56" height="56" rx="14" fill="url(#blockB)"/>
    <rect x="76" y="46" width="48" height="48" rx="10" fill="none" stroke="#bfdbfe" stroke-width="2"/>
    <text x="100" y="83" font-size="34" text-anchor="middle" fill="#ffffff" font-weight="900" font-family="Nunito, sans-serif">B</text>
  </g>
  <!-- Sparkles -->
  <circle cx="50" cy="45" r="4" fill="#facc15"/>
  <circle cx="155" cy="55" r="5" fill="#38bdf8"/>
  <polygon points="100,162 103,170 111,173 103,176 100,184 97,176 89,173 97,170" fill="#facc15"/>
</svg>