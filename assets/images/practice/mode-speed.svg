<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="spdGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="spdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#9a3412" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#spdGlow)"/>
  <!-- Stopwatch Ring -->
  <circle cx="100" cy="105" r="62" fill="url(#circleGrad)" stroke="#f97316" stroke-width="8" filter="url(#spdShadow)"/>
  <!-- Stopwatch Top Button -->
  <rect x="92" y="32" width="16" height="12" rx="4" fill="#f97316"/>
  <rect x="88" y="28" width="24" height="6" rx="3" fill="#ea580c"/>
  <!-- 3D Lightning in Center -->
  <g filter="url(#spdShadow)">
    <polygon points="106,55 76,108 98,108 92,152 128,94 104,94" fill="url(#boltGrad)" stroke="#ca8a04" stroke-width="3"/>
  </g>
  <!-- Yes / No Mini Badges -->
  <circle cx="48" cy="148" r="18" fill="#22c55e" stroke="#ffffff" stroke-width="3" filter="url(#spdShadow)"/>
  <path d="M 40 148 L 46 154 L 56 142" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="152" cy="148" r="18" fill="#ef4444" stroke="#ffffff" stroke-width="3" filter="url(#spdShadow)"/>
  <path d="M 144 140 L 160 156 M 160 140 L 144 156" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>