<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 190" width="100%" height="100%">
  <defs>
    <linearGradient id="cbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="cbInnerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cbDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#075985" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Card Base -->
  <rect x="4" y="4" width="132" height="182" rx="20" fill="url(#cbGrad)" stroke="#bae6fd" stroke-width="5" filter="url(#cbDrop)"/>
  <!-- Inner Frame -->
  <rect x="12" y="12" width="116" height="166" rx="14" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="70" cy="95" r="42" fill="url(#cbInnerGlow)"/>
  <!-- Centered Golden Star & Fenny Paw -->
  <polygon points="70,68 76,82 91,84 80,94 83,109 70,101 57,109 60,94 49,84 64,82" fill="#facc15" stroke="#ca8a04" stroke-width="3" filter="url(#cbDrop)"/>
  <!-- Little Stars on Corners -->
  <circle cx="26" cy="26" r="4" fill="#fef08a"/>
  <circle cx="114" cy="26" r="4" fill="#fef08a"/>
  <circle cx="26" cy="164" r="4" fill="#fef08a"/>
  <circle cx="114" cy="164" r="4" fill="#fef08a"/>
  <!-- Question mark base -->
  <text x="70" y="142" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="900" font-family="Nunito, sans-serif" letter-spacing="2">FENNY</text>
</svg>