<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="memGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <filter id="memShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#4c1d95" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#memGlow)"/>
  <!-- Back Card (Tilted Left) -->
  <g transform="translate(75, 100) rotate(-14) translate(-45, -60)" filter="url(#memShadow)">
    <rect x="0" y="0" width="76" height="106" rx="16" fill="url(#cardGrad1)" stroke="#e9d5ff" stroke-width="4"/>
    <rect x="6" y="6" width="64" height="94" rx="12" fill="none" stroke="#fae8ff" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="38" y="62" font-size="34" text-anchor="middle" fill="#ffffff" font-weight="900" font-family="Nunito, sans-serif">?</text>
  </g>
  <!-- Front Card (Tilted Right) -->
  <g transform="translate(120, 105) rotate(12) translate(-45, -60)" filter="url(#memShadow)">
    <rect x="0" y="0" width="76" height="106" rx="16" fill="#ffffff" stroke="#f472b6" stroke-width="4"/>
    <rect x="6" y="6" width="64" height="94" rx="12" fill="#fff1f2"/>
    <!-- Cute Strawberry / Star Icon inside -->
    <polygon points="38,26 43,40 58,40 46,50 50,64 38,55 26,64 30,50 18,40 33,40" fill="#facc15" stroke="#eab308" stroke-width="2"/>
    <circle cx="38" cy="78" r="8" fill="#f43f5e"/>
    <path d="M 38 70 Q 42 66 44 68" fill="none" stroke="#16a34a" stroke-width="2"/>
  </g>
  <!-- Sparkles -->
  <polygon points="40,40 43,48 51,51 43,54 40,62 37,54 29,51 37,48" fill="#fbbf24"/>
  <polygon points="160,150 162,156 168,158 162,160 160,166 158,160 152,158 158,156" fill="#38bdf8"/>
</svg>