<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="nlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cupGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cupGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#nlGlow)"/>
  <!-- Headband -->
  <path d="M 45 110 A 62 62 0 0 1 155 110" fill="none" stroke="url(#headbandGrad)" stroke-width="20" stroke-linecap="round" filter="url(#shadow3d)"/>
  <path d="M 52 100 A 54 54 0 0 1 148 100" fill="none" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- Left Ear Cup -->
  <g filter="url(#shadow3d)">
    <rect x="25" y="90" width="30" height="50" rx="15" fill="url(#cupGradL)"/>
    <rect x="42" y="96" width="16" height="38" rx="8" fill="url(#cushionGrad)"/>
    <circle cx="36" cy="115" r="5" fill="#bae6fd"/>
  </g>
  <!-- Right Ear Cup -->
  <g filter="url(#shadow3d)">
    <rect x="145" y="90" width="30" height="50" rx="15" fill="url(#cupGradR)"/>
    <rect x="142" y="96" width="16" height="38" rx="8" fill="url(#cushionGrad)"/>
    <circle cx="164" cy="115" r="5" fill="#bae6fd"/>
  </g>
  <!-- Sound Waves & Stars -->
  <path d="M 90 95 Q 100 85 110 95" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <path d="M 82 82 Q 100 68 118 82" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <!-- Star Accent -->
  <polygon points="100,105 104,115 115,116 107,124 109,135 100,129 91,135 93,124 85,116 96,115" fill="#facc15" stroke="#ca8a04" stroke-width="2" filter="url(#shadow3d)"/>
</svg>