<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="tropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="tropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#713f12" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#tropGlow)"/>
  <!-- Trophy Cup Handles -->
  <path d="M 60 70 C 25 70 25 115 65 115" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" filter="url(#tropShadow)"/>
  <path d="M 140 70 C 175 70 175 115 135 115" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" filter="url(#tropShadow)"/>
  <!-- Main Trophy Cup Body -->
  <g filter="url(#tropShadow)">
    <path d="M 58 55 L 142 55 L 132 110 C 126 130 74 130 68 110 Z" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="4"/>
    <ellipse cx="100" cy="55" rx="42" ry="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
  </g>
  <!-- Cup Stem & Base -->
  <g filter="url(#tropShadow)">
    <rect x="92" y="124" width="16" height="24" rx="4" fill="url(#goldGrad)"/>
    <polygon points="76,148 124,148 132,172 68,172" fill="url(#baseGrad)" stroke="#1e40af" stroke-width="3"/>
    <rect x="80" y="154" width="40" height="12" rx="4" fill="#fbbf24"/>
    <text x="100" y="163" font-size="9" text-anchor="middle" fill="#78350f" font-weight="900" font-family="Nunito, sans-serif">1st 3AP</text>
  </g>
  <!-- Embossed Star on Cup -->
  <polygon points="100,75 103,85 114,86 106,94 108,104 100,99 92,104 94,94 86,86 97,85" fill="#ffffff" opacity="0.9"/>
  <!-- Sparkles -->
  <polygon points="50,45 52,51 58,53 52,55 50,61 48,55 42,53 48,51" fill="#facc15"/>
  <polygon points="152,45 154,51 160,53 154,55 152,61 150,55 144,53 150,51" fill="#facc15"/>
</svg>