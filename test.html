      // SynthÃ¨se audio Web Audio pour bruitages immÃ©diats
      let audioCtx = null;
      function playTone(freq, duration, type) {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || "sine";
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }

      function playSuccessChime() {
        playTone(523.25, 0.15);
        setTimeout(() => playTone(659.25, 0.15), 80);
        setTimeout(() => playTone(783.99, 0.3), 160);
      }

      function playErrorBoing() {
        playTone(220, 0.25, "triangle");
      }

      // Confettis
      const cCanvas = document.getElementById("testConfettiCanvas");
      const cCtx = cCanvas.getContext("2d");
      let confettiPieces = [];

      function resizeConfetti() {
        cCanvas.width = window.innerWidth;
        cCanvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeConfetti);
      resizeConfetti();

      function spawnConfetti(count) {
        count = count || 35;
        const colors = ["#f59e0b", "#10b981", "#3b82f6", "#ec4899", "#8b5cf6"];
        for (let i = 0; i < count; i++) {
          confettiPieces.push({
            x: cCanvas.width / 2 + (Math.random() - 0.5) * 300,
            y: cCanvas.height * 0.4,
            vx: (Math.random() - 0.5) * 8,
            vy: -4 - Math.random() * 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: 6 + Math.random() * 8,
            rot: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 12,
            life: 60
          });
        }
      }

      function loopConfetti() {
        cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
        for (let i = confettiPieces.length - 1; i >= 0; i--) {
          const p = confettiPieces[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.25;
          p.rot += p.vRot;
          p.life--;
          if (p.life <= 0) {
            confettiPieces.splice(i, 1);
            continue;
          }
          cCtx.save();
          cCtx.translate(p.x, p.y);
          cCtx.rotate((p.rot * Math.PI) / 180);
          cCtx.fillStyle = p.color;
          cCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          cCtx.restore();
        }
        requestAnimationFrame(loopConfetti);
      }
      requestAnimationFrame(loopConfetti);

      let qIndex = 0;
      let score = 0;
      let streak = 0;
      let questions = [];
      let currentTarget = null;

      function getLangData() {
        const langId = window.AppLang ? window.AppLang.getCurrentLangId() : (localStorage.getItem("selectedLanguage") || "French");
        return QUIZ_ITEMS[langId] || QUIZ_ITEMS.French;
      }

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function startQuiz() {
        const data = getLangData();
        document.documentElement.dir = (window.AppLang && window.AppLang.getCurrentLangId() === "Arabic") ? "rtl" : "ltr";
        document.getElementById("testTitle").textContent = data.title;
        document.getElementById("testSubtitle").textContent = data.subtitle;
        document.getElementById("listenBtnLabel").textContent = data.listen;
        qIndex = 0;
        score = 0;
        streak = 0;
        updateStreak();
        questions = shuffle(data.items).slice(0, 10);
        renderQuestion();
      }

      function updateStreak() {
        const badge = document.getElementById("streakBadge");
        if (streak >= 2) {
          badge.classList.remove("hidden");
          document.getElementById("streakCount").textContent = "ðŸ”¥ SÃ©rie x" + streak;
        } else {
          badge.classList.add("hidden");
        }
      }

      function renderQuestion() {
        const data = getLangData();
        document.getElementById("testScoreLabel").textContent = score + " / 10";

        if (qIndex >= questions.length) {
          // Ã‰cran de victoire festif
          document.getElementById("qCounterBadge").textContent = "Test ComplÃ©tÃ© ! ðŸŽ‰";
          document.getElementById("testProgressFill").style.width = "100%";
          document.getElementById("questionPrompt").textContent = data.doneTitle + score + " / 10 Ã©toiles !";
          document.getElementById("fennyQuizAvatar").src = "assets/images/fennygo/badge-phonics.png";

          spawnConfetti(70);
          playSuccessChime();

          const grid = document.getElementById("testOptionsGrid");
          grid.innerHTML = '<button type="button" class="nk-btn-green flex items-center justify-center gap-2" style="grid-column: 1 / -1; padding: 14px; font-size: 18px;" id="restartTestBtn"><i class="fa-solid fa-rotate-right"></i><span>' + data.restart + '</span></button><a href="category.html" class="nk-btn-purple flex items-center justify-center gap-2" style="grid-column: 1 / -1; padding: 14px; font-size: 18px; text-decoration: none;"><i class="fa-solid fa-house"></i><span>Retour au Menu</span></a>';
          document.getElementById("restartTestBtn").addEventListener("click", startQuiz);
          return;
        }

        currentTarget = questions[qIndex];
        document.getElementById("qCounterBadge").textContent = data.questionWord + " " + (qIndex + 1) + " / 10";
        document.getElementById("testProgressFill").style.width = (((qIndex + 1) / 10) * 100) + "%";
        document.getElementById("questionPrompt").textContent = data.promptPrefix + '"' + currentTarget.label + '" !';
        document.getElementById("fennyQuizAvatar").src = "assets/images/fennygo/fenny-avatar.png";

        const distractors = shuffle(data.items.filter(i => i.label !== currentTarget.label)).slice(0, 3);
        const choices = shuffle([currentTarget, ...distractors]);

        const grid = document.getElementById("testOptionsGrid");
        grid.innerHTML = "";
        let answered = false;

        choices.forEach(ch => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "test-choice-card";
          card.innerHTML = `<img src="${ch.img}" alt="${ch.label}" class="test-choice-img" onerror="this.style.opacity=0;"><span style="font-size: 1.6em; line-height: 1;">${ch.emoji}</span><span class="test-choice-title">${ch.label}</span>`;

          card.addEventListener("click", () => {
            if (answered) return;

            if (ch.label === currentTarget.label) {
              answered = true;
              card.classList.add("correct-flash");
              score++;
              streak++;
              updateStreak();
              playSuccessChime();
              spawnConfetti(30);

              if (window.AppLang) window.AppLang.speak(currentTarget.speech, data.speechLang);

              setTimeout(() => {
                qIndex++;
                renderQuestion();
              }, 750);
            } else {
              streak = 0;
              updateStreak();
              card.classList.add("shake-error");
              playErrorBoing();
              setTimeout(() => card.classList.remove("shake-error"), 500);
            }
          });

          grid.appendChild(card);
        });

        // Lecture vocale automatique de la consigne
        if (window.AppLang) {
          window.AppLang.speak(currentTarget.speech, data.speechLang);
        }
      }

      document.getElementById("listenQuestionBtn").addEventListener("click", () => {
        const data = getLangData();
        if (currentTarget && window.AppLang) {
          window.AppLang.speak(currentTarget.speech, data.speechLang);
        }
      });

      window.addEventListener("DOMContentLoaded", startQuiz);
      window.addEventListener("appLanguageChanged", startQuiz);
