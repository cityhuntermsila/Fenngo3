<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Choose Language - Kids Learner</title>
  <link rel="stylesheet" href="css/common.css?v=7">
  <link rel="stylesheet" href="css/language.css?v=7">
  <style>
    /* Clean styles for 3 cards selection */
    #prevBtn, #nextBtn { display: none !important; }
    .cards-wrapper {
      direction: ltr !important;
      flex-direction: row !important;
      justify-content: center !important;
      gap: 30px !important;
      margin-top: 40px !important;
    }
    .language-card {
      cursor: pointer;
      user-select: none;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .language-card:hover {
      transform: translateY(-8px) scale(1.03);
    }
    .language-sub {
      font-size: 13px;
      font-weight: 700;
      color: #333;
      margin-top: 4px;
      opacity: 0.85;
    }
    .flag img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    @media (max-width: 768px) {
      .cards-wrapper {
        gap: 12px !important;
      }
    }
  </style>
</head>
<body class="language-page h-[100dvh] overflow-hidden">
<main id="languageScreen" class="language-screen page-scroll w-screen h-[100dvh] relative overflow-y-auto overflow-x-hidden flex items-center justify-center px-3 py-24">
        <div class="title-banner">
            <img src="assets/images/language-images/adventure.png" alt="Choose Your Language" class="title-image" />
        </div>

        <div class="lion-box" id="lionBox">
            <img id="lionImg" src="assets/images/language-images/cute-line.png" alt="Lion" />
            <div class="bubble lion-bubble" id="lionBubble">Great Choice!</div>
            <div class="dust dust-1"></div>
            <div class="dust dust-2"></div>
            <div class="dust dust-3"></div>
        </div>

        <div class="selected-animal-box" id="selectedAnimalBox">
            <img id="selectedAnimalImg" src="" alt="" />
            <div class="bubble animal-bubble" id="animalBubble">Let's Learn!</div>
        </div>

        <button class="arrow arrow-left" id="prevBtn" aria-hidden="true">&lsaquo;</button>

        <section class="cards-wrapper" id="cardsWrapper"></section>

        <button class="arrow arrow-right" id="nextBtn" aria-hidden="true">&rsaquo;</button>
    </main>

  <script src="js/app-lang.js?v=7"></script>
  <script src="js/language.js?v=7"></script>
</body>
</html>
