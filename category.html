<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Kids Learner - Dashboard</title>

  <link rel="stylesheet" href="css/common.css?v=13">
  <link rel="stylesheet" href="css/category.css?v=13">
</head>

<body class="category">
  <!-- Header, page and footer rotate together on a portrait mobile. -->
  <div id="categoryApp" class="category-app">
    <main class="category-main page-scroll">
      <img
        src="assets/images/category-images/logo.png"
        class="category-logo"
        alt="Kids Learner"
      >

      <!-- Catégories principales : Cours, Jeux, Traçage/Écriture, Test, Histoire courte -->
      <section class="category-grid main-category-grid" aria-label="Main learning sections">
        <a href="cours.html" class="category-card" data-cat-key="cours" aria-label="Cours">
          <img src="assets/images/category-images/cours.svg" alt="Cours">
        </a>

        <a href="games.html" class="category-card" data-cat-key="games" aria-label="Jeux">
          <img src="assets/images/category-images/games.svg" alt="Jeux">
        </a>

        <a href="tracing.html" class="category-card" data-cat-key="tracing" aria-label="Traçage / Écriture">
          <img src="assets/images/category-images/tracing.svg" alt="Traçage / Écriture">
        </a>

        <a href="test.html" class="category-card" data-cat-key="test" aria-label="Test">
          <img src="assets/images/category-images/test.svg" alt="Test">
        </a>

        <a href="stories.html" class="category-card" data-cat-key="stories" aria-label="Histoire courte">
          <img src="assets/images/category-images/stories.svg" alt="Histoire courte">
        </a>
      </section>
    </main>

    <div id="footer" class="category-footer"></div>
  </div>

  <script src="js/app-lang.js?v=13"></script>
  <script src="js/include.js?v=13"></script>
  <script src="js/category.js?v=13"></script>
</body>

</html>
