<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Kids Learner - Dashboard</title>

  <link rel="stylesheet" href="css/common.css?v=76">
  <link rel="stylesheet" href="css/category.css?v=76">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="category">
  <!-- Header, page and footer rotate together on a portrait mobile. -->
  <div id="categoryApp" class="category-app">
    <main class="category-main page-scroll">
      <img
        src="assets/images/category-images/logo.png"
        class="category-logo"
        alt="Kids Learner"
      >

      <!-- Grille 8 cartes équilibrée (2x4 desktop, 4x2 mobile) -->
      <section class="category-grid main-category-grid" aria-label="Main learning sections">
        <a href="cours.html" class="category-card card-cours" data-cat-key="cours" aria-label="Cours">
          <img src="assets/images/category-images/cours.png" alt="Cours">
        </a>

        <a href="practice.html" class="category-card card-practice" data-cat-key="practice" aria-label="Entraînement & Jeux">
          <img src="assets/images/category-images/practice.svg" alt="Entraînement & Jeux">
        </a>

        <a href="progression.html" class="category-card card-progression" data-cat-key="progression" aria-label="Suivi & Progression">
          <img src="assets/images/category-images/progression.png" alt="Suivi & Progression">
        </a>

        <a href="vocabulary.html" class="category-card card-vocab" data-cat-key="vocabulary" aria-label="Vocabulaire Multisensoriel">
          <img src="assets/images/category-images/vocabulary.svg" alt="Vocabulaire Multisensoriel">
        </a>

        <a href="games.html" class="category-card card-games" data-cat-key="games" aria-label="Jeux">
          <img src="assets/images/category-images/games.png" alt="Jeux">
        </a>

        <a href="tracing.html" class="category-card card-tracing" data-cat-key="tracing" aria-label="Traçage / Écriture">
          <img src="assets/images/category-images/tracing.png" alt="Traçage / Écriture">
        </a>

        <a href="test.html" class="category-card card-test" data-cat-key="test" aria-label="Test">
          <img src="assets/images/category-images/test.png" alt="Test">
        </a>

        <a href="stories.html" class="category-card card-stories" data-cat-key="stories" aria-label="Histoire courte">
          <img src="assets/images/category-images/stories.png" alt="Histoire courte">
        </a>
      </section>
    </main>

    <div id="footer" class="category-footer"></div>
  </div>

  <script src="js/app-lang.js?v=76"></script>
  <script src="js/include.js?v=76"></script>
  <script src="js/category.js?v=76"></script>
</body>

</html>
