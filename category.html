<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Kids Learner - Dashboard</title>

  <!-- Existing project paths are preserved -->
  <link rel="stylesheet" href="css/common.css?v=8">
  <link rel="stylesheet" href="css/category.css?v=8">
</head>

<body class="category">
  <!-- Header, page and footer rotate together on a portrait mobile. -->
  <div id="categoryApp" class="category-app">
    <main class="category-main page-scroll">
      <img
        src="assets/images/category-images/logo.png"
        class="category-logo"
        alt="Kids Learner"
      >

      <section class="category-grid" aria-label="Learning categories">
        <a href="alphabet.html" class="category-card" aria-label="Learn Alphabet">
          <img src="assets/images/category-images/alphabet.png" alt="Alphabet">
        </a>

        <a href="numbers.html" class="category-card" aria-label="Learn Numbers">
          <img src="assets/images/category-images/numbeer.png" alt="Numbers">
        </a>

        <a href="colors.html" class="category-card" aria-label="Learn Colors">
          <img src="assets/images/category-images/color.png" alt="Colors">
        </a>

        <a href="geometry.html" class="category-card" aria-label="Learn Geometry">
          <img src="assets/images/category-images/geometric.png" alt="Geometry">
        </a>

        <a href="family.html" class="category-card" aria-label="Learn Family">
          <img src="assets/images/category-images/family.svg" alt="Family">
        </a>

        <a href="stationery.html" class="category-card" aria-label="Learn School Stationery">
          <img src="assets/images/category-images/stationery.svg" alt="School Stationery">
        </a>

        <a href="body-parts.html" class="category-card" aria-label="Learn Body Parts">
          <img src="assets/images/category-images/body-parts.svg" alt="Body Parts">
        </a>

        <a href="daily-routine.html" class="category-card" aria-label="Learn Daily Routine">
          <img src="assets/images/category-images/daily-routine.svg" alt="Daily Routine">
        </a>

        <a href="common-orders.html" class="category-card" aria-label="Learn Common Orders">
          <img src="assets/images/category-images/common-orders.svg" alt="Common Orders">
        </a>
      </section>
    </main>

    <div id="footer" class="category-footer"></div>
  </div>

  <script src="js/app-lang.js?v=8"></script>
  <script src="js/include.js?v=8"></script>
  <script src="js/category.js?v=8"></script>
</body>

</html>
