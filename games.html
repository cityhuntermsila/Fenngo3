<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Educational Mini-Games - Kids Learner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Nunito:wght@600;700;800;900&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=60">
  <link rel="stylesheet" href="css/games.css?v=60">
</head>

<body class="games-page">
  <div id="gamesApp" class="games-app">

    <!-- =========================================================
         1. ÉCRAN D'ACCUEIL (DESIGN NOVAKID : HERO + FILTRES + CARTES 40PX)
         ========================================================= -->
    <main id="gamesHub" class="games-hub page-scroll">
      <!-- Section Hero Novakid avec dégradé lavande & filtres de compétences -->
      <header class="nk-hero">
        <div class="nk-hero-top">
          <div class="nk-hero-text">
            <h1 id="hubMainTitle" class="nk-hero-title">Jeux éducatifs pour les enfants</h1>
            <p id="hubMainSubtitle" class="nk-hero-subtitle">Des jeux ludiques et interactifs pour faire progresser votre enfant !</p>
          </div>

          <!-- Fenny Companion Hero Badge -->
          <div class="fenny-interactive-bubble hidden md:flex">
            <img src="assets/images/fennygo/fenny-avatar.png" class="fenny-interactive-avatar" alt="Fenny">
            <div>
              <span class="text-xs font-black text-amber-900 block">🦊 Fenny t'accompagne !</span>
              <span class="text-[11px] font-bold text-amber-800">Gagne des étoiles et diamants ⭐💎</span>
            </div>
          </div>

          <div class="nk-counters">
            <a href="progression.html" class="hidden sm:inline-flex items-center gap-1.5 bg-amber-100 border-2 border-amber-400 rounded-full px-3 py-1 text-xs font-black text-amber-950 hover:scale-105 transition" title="Gamified Assessment & Badges">
              <img src="assets/images/fennygo/badge-phonics.png" alt="Badges" class="w-6 h-6 object-contain">
              <span>Badges &amp; Progression</span>
            </a>
            <div class="nk-stat-pill nk-star-pill" title="Stars">
              <img src="assets/images/games/star.png" alt="Stars" class="w-6 h-6 object-contain">
              <span id="hubStarsCount">0</span>
            </div>
            <div class="nk-stat-pill nk-diamond-pill" title="Diamonds">
              <img src="assets/images/games/gems.png" alt="Diamonds" class="w-6 h-6 object-contain">
              <span id="hubDiamondsCount">0</span>
            </div>
          </div>
        </div>

        <!-- Barre de filtres par compétence style Novakid (.gamesArchive__quizPill) -->
        <div class="nk-quiz-bar">
          <span id="hubFilterLabel" class="nk-quiz-label">Sélectionnez les compétences :</span>
          <div id="hubSkillsFilter" class="nk-skills-pills" role="tablist" aria-label="Skills filter"></div>
        </div>
      </header>

      <!-- Grille Ludothèque des 7 Mini-Jeux style Novakid (.gamesArchive__card) -->
      <section id="hubGrid" class="hub-grid" aria-label="Educational Games List"></section>
    </main>

    <!-- =========================================================
         2. ÉCRAN DE JEU ACTIF (CONTENEUR UNIVERSEL DES 7 JEUX)
         ========================================================= -->
    <section id="gameScreen" class="game-screen hidden" aria-live="polite">
      <!-- Barre supérieure commune style Novakid -->
      <header class="game-topbar" dir="ltr">
        <!-- En haut à gauche : Bouton X + Compteurs -->
        <div class="topbar-left">
          <button type="button" id="exitGameBtn" class="exit-game-btn" aria-label="Exit to Hub">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <div class="nk-stat-pill nk-star-pill">
            <img src="assets/images/games/star.png" alt="Stars" class="w-5 h-5 object-contain">
            <span id="gameStarsCount">0</span>
          </div>
          <div class="nk-stat-pill nk-diamond-pill">
            <img src="assets/images/games/gems.png" alt="Diamonds" class="w-5 h-5 object-contain">
            <span id="gameDiamondsCount">0</span>
          </div>
        </div>

        <!-- En haut au centre : Titre du jeu + Barre de progression -->
        <div class="topbar-center">
          <div class="progress-header">
            <span id="activeGameTitle" class="active-game-title">Game</span>
            <span id="progressLabel" class="progress-label">0 / 5</span>
          </div>
          <div class="progress-track">
            <div id="progressFill" class="progress-fill" style="width: 0%"></div>
          </div>
        </div>

        <!-- Bouton Haut-parleur pour réécouter la consigne ou le son cible -->
        <div class="topbar-right">
          <button type="button" id="replaySoundBtn" class="speaker-btn" aria-label="Listen again">
            <i class="fa-solid fa-volume-high"></i>
            <span id="targetPromptBadge" class="target-prompt-badge">Listen</span>
          </button>
        </div>
      </header>

      <!-- Zone de rendu interactive (Canvas 60FPS + UI superposée spécifique au jeu) -->
      <div id="gameStage" class="game-stage">
        <canvas id="gameCanvas" class="game-canvas"></canvas>
        <div id="gameOverlayUI" class="game-overlay-ui"></div>
      </div>

      <!-- Canvas de confettis global -->
      <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

      <!-- Modal de Victoire de la Manche style Novakid -->
      <div id="victoryModal" class="victory-modal hidden" role="dialog" aria-modal="true">
        <div class="victory-card">
          <div class="victory-trophy flex justify-center">
            <img src="assets/images/games/trophy.png" alt="Trophy" class="w-24 h-24 object-contain drop-shadow-lg">
          </div>
          <h2 id="victoryTitle" class="victory-title">Great Job Champion!</h2>
          <p id="victoryMessage" class="victory-subtitle">You completed the round successfully!</p>
          <div class="victory-rewards">
            <span class="reward-badge inline-flex items-center gap-1.5"><img src="assets/images/games/star.png" alt="Stars" class="w-5 h-5 object-contain"> +5</span>
            <span class="reward-badge inline-flex items-center gap-1.5"><img src="assets/images/games/gems.png" alt="Diamonds" class="w-5 h-5 object-contain"> +3</span>
          </div>
          <div class="victory-actions">
            <button type="button" id="playAgainBtn" class="nk-btn-green">
              <i class="fa-solid fa-rotate-right"></i>
              <span id="playAgainText">Play Again</span>
            </button>
            <button type="button" id="backToHubBtn" class="nk-btn-purple">
              <i class="fa-solid fa-grip"></i>
              <span id="backToHubText">Games Menu</span>
            </button>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="js/app-lang.js?v=60"></script>
  <script src="js/games.js?v=41"></script>
</body>

</html>
