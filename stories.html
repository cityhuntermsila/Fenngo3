<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Kids Learner - Histoires Courtes 3AP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=61">
  <link rel="stylesheet" href="css/games.css?v=61">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    .stories-stage {
      width: min(96vw, 1180px);
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(12px, 1.8vw, 22px);
      align-items: stretch;
    }

    @media (min-width: 601px) and (max-width: 960px) {
      .stories-stage {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        max-width: 760px !important;
      }
    }

    @media (max-width: 960px), screen and (max-height: 560px) {
      html, body.games-page {
        overflow-y: auto !important;
        height: auto !important;
        -webkit-overflow-scrolling: touch !important;
      }
      .games-app {
        height: auto !important;
        min-height: 100dvh !important;
      }
      .games-hub {
        height: auto !important;
        min-height: 100dvh !important;
        overflow-y: visible !important;
        padding: 10px 8px 24px !important;
      }
      .story-reader-card {
        width: min(95vw, 680px) !important;
        max-height: 94dvh !important;
        padding: 14px 10px !important;
        border-radius: 24px !important;
        gap: 10px !important;
      }
      .story-scene-box {
        padding: 10px 8px !important;
        border-radius: 20px !important;
        gap: 8px !important;
      }
      .story-scene-illustrations {
        min-height: 60px !important;
        gap: 10px !important;
      }
      .story-scene-img {
        width: clamp(50px, 9vh, 70px) !important;
        height: clamp(50px, 9vh, 70px) !important;
      }
      .story-text-container {
        font-size: clamp(14px, 2.2vh, 18px) !important;
        padding: 4px 8px !important;
      }
      .story-moral-pill {
        font-size: 12px !important;
        padding: 4px 12px !important;
      }
      .story-quiz-panel {
        padding: 8px !important;
        border-radius: 16px !important;
      }
    }

    @media (max-width: 600px) {
      .stories-stage {
        grid-template-columns: 1fr !important;
        max-width: 380px !important;
        margin: 0 auto !important;
        overflow-y: visible !important;
        gap: 12px !important;
      }
    }

    .story-reader-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(43, 36, 31, 0.74);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .story-reader-card {
      width: min(840px, 94vw);
      max-height: 94dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      background: #fffcf6;
      border: clamp(5px, 1vw, 8px) solid #dec28f;
      border-bottom: clamp(7px, 1.3vw, 11px) solid #c59f5f;
      border-radius: 36px;
      padding: clamp(16px, 2.8vh, 28px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .story-scene-box {
      background: linear-gradient(180deg, #fdf4e1 0%, #f9e2b5 100%);
      border: 2px solid #dec28f;
      border-radius: 26px;
      padding: clamp(14px, 2.2vh, 22px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.7);
    }

    .story-scene-illustrations {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 80px;
    }

    .story-scene-img {
      width: clamp(65px, 11vh, 95px);
      height: clamp(65px, 11vh, 95px);
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.15));
      animation: floatScene 3s ease-in-out infinite alternate;
    }

    @keyframes floatScene {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }

    .story-text-container {
      font-size: clamp(17px, 2.7vh, 25px);
      font-weight: 800;
      color: #2b241f;
      line-height: 1.5;
      padding: 6px 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.65);
      border: 1.5px solid rgba(222, 194, 143, 0.45);
    }

    .story-moral-pill {
      background: #d1fae5;
      color: #065f46;
      border: 2px solid #10b981;
      border-radius: 18px;
      padding: 6px 16px;
      font-size: clamp(13px, 1.8vh, 16px);
      font-weight: 900;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.2);
    }

    .story-quiz-panel {
      background: #eff6ff;
      border: 2px solid #93c5fd;
      border-radius: 20px;
      padding: 12px;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>

<body class="games-page">
  <div id="storiesApp" class="games-app">
    <main class="games-hub page-scroll">
      <header class="nk-hero">
        <div class="nk-hero-top">
          <div class="nk-hero-text">
            <h1 id="storiesMainTitle" class="nk-hero-title">Histoires courtes pour enfants 3AP</h1>
            <p id="storiesMainSubtitle" class="nk-hero-subtitle">Écoute, lis mot à mot et réponds aux énigmes de Fenny !</p>
          </div>
          <div class="nk-counters">
            <div class="nk-stat-pill">
              <span class="text-xl">📚</span>
              <span id="storiesCountBadge">3 Histoires</span>
            </div>
          </div>
        </div>
      </header>

      <section id="storiesGrid" class="stories-stage" aria-label="Short Stories List"></section>
    </main>

    <!-- Lecteur d'histoire interactif enrichi -->
    <div id="storyReaderModal" class="story-reader-modal hidden" role="dialog" aria-modal="true">
      <div class="story-reader-card">
        <!-- Barre d'en-tête du lecteur -->
        <div class="flex items-center justify-between gap-3 border-b-2 border-amber-200 pb-3">
          <div class="flex items-center gap-2">
            <span class="w-8 h-8 rounded-full bg-amber-400 text-amber-950 font-black flex items-center justify-center">📖</span>
            <h2 id="readerStoryTitle" class="text-lg sm:text-xl font-black text-amber-950">Histoire</h2>
          </div>
          <div class="flex items-center gap-3">
            <span id="storyPageIndicator" class="nk-tag font-black">Page 1 / 3</span>
            <button type="button" id="closeStoryBtn" class="exit-game-btn" aria-label="Fermer l'histoire">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <!-- Scène illustrée avec animations 3D -->
        <div class="story-scene-box">
          <div id="readerSceneIllustrations" class="story-scene-illustrations"></div>

          <!-- Texte interactif mot à mot -->
          <div id="readerStoryText" class="story-text-container" aria-live="polite"></div>

          <!-- Bouton de lecture vocale karaoke -->
          <div class="flex items-center gap-2 mt-1">
            <button type="button" id="listenStoryBtn" class="nk-btn-purple flex items-center gap-2 px-5 py-2 text-sm font-black shadow-md hover:scale-105 transition">
              <i class="fa-solid fa-volume-high"></i>
              <span id="listenStoryLabel">Lire avec Fenny</span>
            </button>
            <span class="text-xs font-bold text-amber-900/70">👈 Touche n'importe quel mot pour l'écouter !</span>
          </div>

          <div id="readerStoryMoral" class="story-moral-pill"></div>
        </div>

        <!-- Mini Défi Compréhension interactif -->
        <div id="storyQuizBox" class="story-quiz-panel hidden">
          <span class="text-xs font-black text-blue-900 uppercase">🦊 Énigme de Fenny :</span>
          <p id="storyQuizQuestion" class="text-sm sm:text-base font-bold text-slate-900"></p>
          <div id="storyQuizOptions" class="flex flex-wrap justify-center gap-2 mt-1"></div>
        </div>

        <!-- Barre de pagination -->
        <div class="flex items-center justify-between gap-4 mt-2">
          <button type="button" id="prevPageBtn" class="nk-btn-purple px-4 py-2 text-sm font-black flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i>
            <span id="prevPageLabel">Précédent</span>
          </button>
          <span class="text-xs font-black text-amber-800">🦊 FENNY STORYTELLER</span>
          <button type="button" id="nextPageBtn" class="nk-btn-green px-4 py-2 text-sm font-black flex items-center gap-2">
            <span id="nextPageLabel">Suivant</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

          speechLang: "en-US",
          stories: [

            {

                },
                {

                {

              pages: [
                {

      let activeStory = null;
      let pageIdx = 0;

      function getLangData() {
        const langId = window.AppLang ? window.AppLang.getCurrentLangId() : (localStorage.getItem("selectedLanguage") || "French");
        return STORIES_DATA[langId] || STORIES_DATA.French;
      }

      function renderStoriesHub() {
        const data = getLangData();
        document.documentElement.dir = (window.AppLang && window.AppLang.getCurrentLangId() === "Arabic") ? "rtl" : "ltr";
        document.getElementById("storiesMainTitle").textContent = data.title;
        document.getElementById("storiesMainSubtitle").textContent = data.subtitle;
        document.getElementById("listenStoryLabel").textContent = data.listen;
        document.getElementById("prevPageLabel").textContent = data.prev;
        document.getElementById("nextPageLabel").textContent = data.next;

        const grid = document.getElementById("storiesGrid");
        grid.innerHTML = "";

        data.stories.forEach((st, idx) => {
          const card = document.createElement("article");
          card.className = "hub-game-card";
          card.style.width = "100%";
          card.style.height = "100%";
          card.style.setProperty("--card-visual-bg", st.bg);

          card.innerHTML = `
            <div class="nk-card-visual" style="position: relative;">
              <span class="nk-card-step">${idx + 1}</span>
              <img src="${st.thumb}" alt="${st.title}" class="w-24 h-24 sm:w-28 sm:h-28 object-contain drop-shadow-xl hover:scale-110 transition duration-300">
            </div>
            <div class="nk-card-body">
              <ul class="nk-card-tags"><li class="nk-tag">${st.tag}</li></ul>
              <div class="nk-card-info">
                <h2 class="nk-card-title" style="font-size: clamp(16px, 2.4vh, 22px);">${st.title}</h2>
                <p class="nk-card-desc" style="-webkit-line-clamp: 2;">${st.desc}</p>
              </div>
              <div class="nk-card-actions">
                <button type="button" class="nk-btn-purple">${data.readBtn}</button>
              </div>
            </div>
          `;
          card.addEventListener("click", () => openStory(st));
          grid.appendChild(card);
        });
      }

      function openStory(story) {
        activeStory = story;
        pageIdx = 0;
        document.getElementById("storyReaderModal").classList.remove("hidden");
        renderStoryPage();
      }

      function renderStoryPage() {
        if (!activeStory) return;
        const data = getLangData();
        const p = activeStory.pages[pageIdx];

        document.getElementById("readerStoryTitle").textContent = activeStory.title;
        document.getElementById("readerStoryMoral").textContent = activeStory.moral;
        document.getElementById("storyPageIndicator").textContent = (pageIdx + 1) + " / " + activeStory.pages.length;

        // Rendu des illustrations de la page
        const illusBox = document.getElementById("readerSceneIllustrations");
        illusBox.innerHTML = "";
        (p.images || []).forEach(src => {
          const img = document.createElement("img");
          img.src = src;
          img.className = "story-scene-img";
          img.alt = "Illustration";
          illusBox.appendChild(img);
        });

        // Texte interactif mot par mot (Tap-to-Speak)
        const textBox = document.getElementById("readerStoryText");
        textBox.innerHTML = "";
        const words = (p.text || "").split(" ");
        words.forEach(w => {
          const span = document.createElement("span");
          span.className = "story-word-tap";
          span.textContent = w;
          span.title = "Touche pour écouter : " + w;
          span.addEventListener("click", (e) => {
            e.stopPropagation();
            span.classList.add("speaking");
            if (window.AppLang) {
              window.AppLang.speak(w.replace(/[.,!?;:«»]/g, ""), data.speechLang);
            }
            setTimeout(() => span.classList.remove("speaking"), 600);
          });
          textBox.appendChild(span);
        });

        // Énigme interactive sur la dernière page
        const quizBox = document.getElementById("storyQuizBox");
        if (pageIdx === activeStory.pages.length - 1 && activeStory.quiz) {
          quizBox.classList.remove("hidden");
          document.getElementById("storyQuizQuestion").textContent = activeStory.quiz.question;
          const optionsBox = document.getElementById("storyQuizOptions");
          optionsBox.innerHTML = "";
          activeStory.quiz.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "nk-tag font-bold text-sm hover:scale-105 transition cursor-pointer";
            btn.textContent = opt.text;
            btn.addEventListener("click", () => {
              if (opt.correct) {
                btn.style.background = "#86efac";
                btn.style.borderColor = "#16a34a";
                btn.textContent = opt.text + " ⭐ Bravo !";
                if (window.AppLang) window.AppLang.speak("Bravo ! Bonne réponse !", data.speechLang);
              } else {
                btn.style.background = "#fca5a5";
                setTimeout(() => { btn.style.background = ""; }, 500);
              }
            });
            optionsBox.appendChild(btn);
          });
        } else {
          quizBox.classList.add("hidden");
        }

        // Lecture vocale automatique de la page
        if (window.AppLang) {
          window.AppLang.speak(p.speech, data.speechLang);
        }
      }

      document.getElementById("closeStoryBtn").addEventListener("click", () => {
        if (window.AppLang) window.AppLang.stopSpeech();
        document.getElementById("storyReaderModal").classList.add("hidden");
      });

      document.getElementById("prevPageBtn").addEventListener("click", () => {
        if (!activeStory) return;
        pageIdx = (pageIdx - 1 + activeStory.pages.length) % activeStory.pages.length;
        renderStoryPage();
      });

      document.getElementById("nextPageBtn").addEventListener("click", () => {
        if (!activeStory) return;
        pageIdx = (pageIdx + 1) % activeStory.pages.length;
        renderStoryPage();
      });

      document.getElementById("listenStoryBtn").addEventListener("click", () => {
        if (!activeStory) return;
        const data = getLangData();
        const p = activeStory.pages[pageIdx];
        if (window.AppLang) window.AppLang.speak(p.speech, data.speechLang);
      });

      window.addEventListener("DOMContentLoaded", renderStoriesHub);
      window.addEventListener("appLanguageChanged", renderStoriesHub);
    })();
  </script>
